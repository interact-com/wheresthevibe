<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- maximum-scale stops iOS Safari zooming in when a text field is tapped -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Add to Home Screen: opens full screen like an app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Vibe" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #0e0f0f;
        color-scheme: dark;
      }
      body {
        overflow: hidden;
        margin: 0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        max-width: 480px;
        margin: 0 auto;
      }
      /* Map credit line in the app's dark colours */
      #root .leaflet-container .leaflet-control-attribution {
        background: rgba(14, 15, 15, 0.75);
        color: #a3a8a8;
      }
      #root .leaflet-container .leaflet-control-attribution a {
        color: #6ecbc8;
      }
      /* On a laptop, show the app as a phone-width column */
      @media (min-width: 520px) {
        #root {
          border-left: 1px solid #262a2a;
          border-right: 1px solid #262a2a;
        }
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
